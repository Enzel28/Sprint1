<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Imagem de Fundo</title>
<style>
        body {
            /* Remove as margens padrão do navegador */
            margin: 200px;
            
            /* Define a altura como 100% da janela de visualização */
            width: 400px;
            height: 800px;

            /* Imagem de fundo */
            background-image: url("Flow.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            /* Alinhamento ao centro com Flexbox */
            display: flex;
            flex-direction:column; /* Organiza os elementos (título e botão) em coluna */
            justify-content: center; /* Centraliza verticalmente */
            align-items: center;    /* Centraliza horizontalmente */
            text-align: center;
        }
    </style>

</head>

<body>
    <main>
        <section class="card">
            <h1>Titulo</h1>
            <a href="https://enzel28.github.io/Sobre-mim/">Botão clicavel</a>
        </section>
    </main>


</body>
</html>
